name: Cruce de canales

on:
  workflow_dispatch:

jobs:
  cruce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rapidfuzz
      - run: python tools/cruce.py
      - uses: actions/upload-artifact@v4
        with:
          name: cruce-resultados
          path: out/
